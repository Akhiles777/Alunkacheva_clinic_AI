<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет сети — Алункачева клиник</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbfbfd;
        color: #1c1c22;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 18px;
        font-weight: 500;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #5c5c68;
        margin: 0 0 20px;
      }
      button {
        background: #4b44c7;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121216; color: #ececf1; }
        p { color: #9a9aa8; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Нет подключения</h1>
      <p>
        Данные клиники доступны только онлайн — карточки пациентов не хранятся
        в памяти устройства. Проверьте сеть и повторите.
      </p>
      <button onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
