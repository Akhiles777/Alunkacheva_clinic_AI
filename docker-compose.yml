# Боевой контур на VDS/VPS.
#
# По §7 медицинские персональные данные обрабатываются на серверах в РФ,
# поэтому база живёт здесь же, рядом с приложением, а не у зарубежного
# провайдера. Наружу торчит только обратный прокси с TLS.
#
# Настройки: единственный файл .env рядом с этим (образец — deploy/env.example).
# Запуск:  docker compose up -d --build
# Миграции накатывает разовый контейнер migrate до старта приложения.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      # Свой часовой пояс у базы: отчётные сутки клиники считаются по Москве.
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Порт наружу не публикуем: база доступна только внутри сети compose.
    # Открытый 5432 на VDS — самый частый способ потерять базу целиком.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic} -d ${POSTGRES_DB:-clinic}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Ограничения: под нагрузкой база не должна съесть всю память сервера и
    # утащить за собой приложение.
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}

  # Разовый контейнер: накатывает миграции и завершается. Приложение стартует
  # только после его успешного завершения — иначе оно поднимется на схеме
  # предыдущей версии и начнёт падать на неизвестных колонках.
  migrate:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC: ${NEXT_PUBLIC_VAPID_PUBLIC:-}
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC: ${NEXT_PUBLIC_VAPID_PUBLIC:-}
    restart: unless-stopped
    # Один файл на всё: docker compose подставляет ${...} только из .env, и
    # второй файл с настройками привёл бы к пустому домену и паролю при
    # заполненном на вид окружении. Образец — deploy/env.example.
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TZ: ${TZ:-Europe/Moscow}
      # Постоянный процесс, а не бессерверный вызов: пул держим нормального
      # размера. Значение по умолчанию (1) рассчитано на Vercel, где каждый
      # вызов живёт в своём экземпляре.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1g}

  # TLS и раздача наружу. Caddy сам получает и продлевает сертификат
  # Let's Encrypt — на боевом контуре с медицинскими данными HTTP недопустим.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?нужен DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Ежедневная резервная копия базы. Копия, из которой ни разу не
  # восстанавливались, копией не считается — порядок проверки в DEPLOY.md.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_USER:-clinic}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-clinic}
      PGHOST: db
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  backups:
  caddy-data:
  caddy-config:
